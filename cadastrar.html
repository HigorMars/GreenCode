<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>GreenCode - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Cadastrar Novo Usuário 🌱</h2>
    <form id="cadastro-form">
      <div class="form-group">
        <label for="new-username">Novo Usuário:</label>
        <input type="text" id="new-username" placeholder="Escolha um nome de usuário" required>
        <small class="error-msg" id="reg-user-error"></small>
      </div>

      <div class="form-group">
        <label for="new-password">Senha:</label>
        <input type="password" id="new-password" placeholder="tp12026" required>
        <small class="dica-campo">Mínimo 8 caracteres, com 1 número e 1 letra maiúscula.</small>
        <small class="error-msg" id="reg-pass-error"></small>
      </div>

      <button type="button" onclick="cadastrarUsuario()">Cadastrar</button>
    </form>
    <br>
    <a href="index.html">Voltar para Login</a>
  </div>

  <script src="auth.js"></script>
</body>
</html>
